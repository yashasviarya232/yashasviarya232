<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" fill="none" role="img" aria-label="Frontend CRUD project card">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="880" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1124"/>
      <stop offset="1" stop-color="#17102E"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="880" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#831843" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#4C1D95" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="32" y1="70" x2="470" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="accent" x1="32" y1="0" x2="84" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="726" y1="114" x2="814" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="0" cy="0" r="1" gradientTransform="translate(770 150) rotate(90) scale(170 190)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BE185D" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#BE185D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="12" y="12" width="856" height="216" rx="22" fill="#070B18" opacity="0.9"/>
  <rect x="6" y="6" width="868" height="222" rx="22" fill="#0A1024"/>
  <rect x="0.75" y="0.75" width="878.5" height="238.5" rx="21" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="878.5" height="238.5" rx="21" fill="url(#cardGlow)"/>
  <path d="M22 1.5H858" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <circle cx="812" cy="30" r="4" fill="#F87171" fill-opacity="0.8"/>
  <circle cx="828" cy="30" r="4" fill="#FBBF24" fill-opacity="0.8"/>
  <circle cx="844" cy="30" r="4" fill="#34D399" fill-opacity="0.8"/>

  <rect x="32" y="22" width="104" height="26" rx="13" fill="#F472B6" fill-opacity="0.08" stroke="#F472B6" stroke-opacity="0.35"/>
  <text x="84" y="39.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8" fill="#FBCFE8">FRONTEND</text>

  <text x="848" y="108" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" fill-opacity="0.035">02</text>

  <text x="32" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="url(#titleGrad)">Frontend CRUD</text>
  <rect x="32" y="106" width="52" height="3" rx="1.5" fill="url(#accent)"/>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
    <text x="32" y="138">A responsive React interface for create, read, update, and delete</text>
    <text x="32" y="160">workflows with live REST API integration.</text>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#FBCFE8" text-anchor="middle">
    <rect x="32" y="182" width="64" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#F0ABFC" stroke-opacity="0.3"/>
    <text x="64" y="198">React</text>
    <rect x="104" y="182" width="86" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#F0ABFC" stroke-opacity="0.3"/>
    <text x="147" y="198">JavaScript</text>
    <rect x="198" y="182" width="54" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#F0ABFC" stroke-opacity="0.3"/>
    <text x="225" y="198">CSS</text>
    <rect x="260" y="182" width="52" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#F0ABFC" stroke-opacity="0.3"/>
    <text x="286" y="198">Vite</text>
  </g>

  <g opacity="0.95">
    <polygon points="770,114 814,140 770,166 726,140" fill="url(#cubeTop)"/>
    <polygon points="726,140 770,166 770,210 726,184" fill="#7E22CE"/>
    <polygon points="770,166 814,140 814,184 770,210" fill="#9D174D"/>
    <polygon points="770,114 814,140 770,166 726,140" fill="none" stroke="#F5D0FE" stroke-opacity="0.35"/>
    <path d="M726 140V184M814 140V184M770 166V210" stroke="#FBCFE8" stroke-opacity="0.22"/>
  </g>

  <text x="848" y="214" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#F472B6">VIEW REPOSITORY  &#8594;</text>
